[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdskoo"
version = "1.0.0"
description = "SkookumScript decompiler for Sleeping Dogs: Definitive Edition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/Yuriinm/sleeping-dogs-skookum-decompiler"

[project.scripts]
sdskoo = "sdskoo.cli:main"

[tool.setuptools]
packages = ["sdskoo"]
